<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FSL · Predictions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #111114;
  --card:      #18181c;
  --card2:     #1e1e24;
  --line:      rgba(255,255,255,.07);
  --line2:     rgba(255,255,255,.12);
  --t1:        #f4f4f6;
  --t2:        #8888a0;
  --t3:        #44445a;
  --blue:      #4f8ef7;
  --blue-d:    rgba(79,142,247,.12);
  --green:     #22c55e;
  --green-d:   rgba(34,197,94,.1);
  --amber:     #f59e0b;
  --amber-d:   rgba(245,158,11,.1);
  --red:       #ef4444;
  --red-d:     rgba(239,68,68,.1);
  --mono: 'DM Mono', monospace;
  --sans: 'DM Sans', sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg:      #f2f2f5;
    --card:    #ffffff;
    --card2:   #f7f7fa;
    --line:    rgba(0,0,0,.06);
    --line2:   rgba(0,0,0,.10);
    --t1:      #0a0a10;
    --t2:      #60607a;
    --t3:      #a0a0b8;
  }
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--bg);color:var(--t1);min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── TOP BAR ── */
.topbar{
  position:sticky;top:0;z-index:200;
  background:var(--card);
  border-bottom:1px solid var(--line);
  backdrop-filter:blur(20px);
}
.topbar-inner{
  max-width:1100px;margin:0 auto;
  padding:0 24px;height:52px;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{font-size:13px;font-weight:700;letter-spacing:.5px;color:var(--t1)}
.brand em{font-style:normal;color:var(--blue)}
.topbar-right{display:flex;align-items:center;gap:20px}
.live-pill{
  display:flex;align-items:center;gap:6px;
  background:var(--green-d);border:1px solid rgba(34,197,94,.2);
  border-radius:20px;padding:4px 10px;
  font-size:11px;font-weight:600;color:var(--green);letter-spacing:.5px
}
.live-pill::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.topbar-date{font-size:12px;color:var(--t3);font-family:var(--mono)}

/* ── LAYOUT ── */
.shell{max-width:1100px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:220px 1fr;gap:0;min-height:100vh}

/* ── LEFT SIDEBAR ── */
.sidebar{
  border-right:1px solid var(--line);
  padding:28px 0;
  position:sticky;top:52px;
  height:calc(100vh - 52px);
  overflow-y:auto;
}
.sidebar::-webkit-scrollbar{width:0}
.sidebar-section{margin-bottom:28px}
.sidebar-label{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:1.2px;padding:0 20px;margin-bottom:10px}

/* Stats */
.stat-list{padding:0 20px;display:flex;flex-direction:column;gap:8px}
.stat-row{display:flex;align-items:center;justify-content:space-between}
.stat-row-label{font-size:13px;color:var(--t2)}
.stat-row-val{font-size:18px;font-weight:700;font-family:var(--mono)}
.stat-row-val.blue{color:var(--blue)}
.stat-row-val.green{color:var(--green)}
.stat-row-val.amber{color:var(--amber)}

/* League filter */
.league-list{display:flex;flex-direction:column}
.league-btn{
  padding:9px 20px;font-size:13px;font-weight:500;color:var(--t2);
  background:none;border:none;cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:8px;transition:all .15s;
  border-left:2px solid transparent;
}
.league-btn:hover{color:var(--t1);background:var(--line)}
.league-btn.on{color:var(--blue);border-left-color:var(--blue);background:var(--blue-d)}
.league-flag{font-size:14px;flex-shrink:0}

/* Tabs in sidebar */
.tab-list{padding:0 20px;display:flex;flex-direction:column;gap:4px}
.tab-btn-s{
  padding:8px 12px;border-radius:8px;font-size:13px;font-weight:500;
  color:var(--t2);background:none;border:none;cursor:pointer;text-align:left;transition:all .15s;
}
.tab-btn-s:hover{color:var(--t1);background:var(--line)}
.tab-btn-s.on{color:var(--t1);background:var(--card2)}

/* ── MAIN CONTENT ── */
.content{padding:28px 0 28px 28px;min-width:0}

/* Page header */
.page-hdr{margin-bottom:24px}
.page-title{font-size:24px;font-weight:700;letter-spacing:-.4px;line-height:1.1}
.page-title span{color:var(--blue)}
.page-sub{font-size:13px;color:var(--t3);margin-top:5px;font-family:var(--mono)}

.notice-bar{
  font-size:12px;color:var(--amber);padding:9px 14px;
  background:var(--amber-d);border:1px solid rgba(245,158,11,.2);
  border-radius:8px;margin-bottom:16px;display:none;
}

/* Day group */
.day-group{margin-bottom:4px}
.day-hdr{
  display:flex;align-items:center;gap:10px;
  padding:16px 0 8px;
}
.day-hdr:first-child{padding-top:0}
.day-name{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:1px}
.day-rule{flex:1;height:1px;background:var(--line)}
.day-ct{font-size:11px;color:var(--t3);font-family:var(--mono)}

/* ── FIXTURE CARD ── */
.fcard{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  margin-bottom:6px;
  overflow:hidden;
  cursor:pointer;
  opacity:0;
  animation:cardUp .3s ease forwards;
  transition:border-color .15s;
}
.fcard:hover{border-color:var(--line2)}
.fcard.con{border-left:3px solid var(--green)}
.fcard.hi{border-left:3px solid var(--blue)}
@keyframes cardUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Card top row */
.fcard-top{
  display:grid;
  grid-template-columns:72px 1fr 130px 100px 28px;
  align-items:center;gap:12px;
  padding:14px 16px;
}

/* Time block */
.fc-time{text-align:center}
.fc-kick{font-size:17px;font-weight:700;font-family:var(--mono);color:var(--t1);line-height:1}
.fc-tz{font-size:9px;color:var(--t3);margin-top:2px;text-transform:uppercase;letter-spacing:.6px}

/* Match block */
.fc-match{}
.fc-comp{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:5px}
.fc-teams{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.fc-team{font-size:14px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.fc-vs{font-size:10px;color:var(--t3);flex-shrink:0}
.fc-pos{font-size:11px;color:var(--t3)}

/* Tags */
.fc-tags{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.signal-badge{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;
}
.signal-badge.con{background:var(--green-d);color:var(--green);border:1px solid rgba(34,197,94,.2)}
.signal-badge.spl{background:var(--amber-d);color:var(--amber);border:1px solid rgba(245,158,11,.2)}
.signal-badge.data{background:var(--amber-d);color:var(--amber);border:1px solid rgba(245,158,11,.2)}
.signal-badge.avd{background:var(--red-d);color:var(--red);border:1px solid rgba(239,68,68,.2)}
.signal-badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.ntag-row{display:flex;gap:4px;flex-wrap:wrap}
.ntag{font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;background:var(--card2);border:1px solid var(--line2);color:var(--t2)}
.ntag.p{background:var(--blue-d);border-color:rgba(79,142,247,.2);color:var(--blue)}
.ntag.s{background:var(--amber-d);border-color:rgba(245,158,11,.2);color:var(--amber)}

/* Verdict */
.fc-verdict{text-align:right}
.verdict-pill{
  display:inline-block;font-size:12px;font-weight:700;
  padding:5px 12px;border-radius:8px;letter-spacing:.3px;margin-bottom:5px;
}
.verdict-pill.home{background:var(--blue-d);color:var(--blue)}
.verdict-pill.away{background:var(--red-d);color:var(--red)}
.verdict-pill.draw{background:rgba(255,255,255,.06);color:var(--t2);border:1px solid var(--line2)}
.fc-score{font-size:11px;color:var(--t3);font-family:var(--mono);margin-bottom:5px}
.fc-conf{font-size:11px;font-weight:600;color:var(--t2);font-family:var(--mono)}
.conf-bar{height:2px;background:var(--line2);border-radius:1px;margin-top:4px;overflow:hidden}
.conf-fill{height:2px;border-radius:1px;width:0;transition:width 1s cubic-bezier(.4,0,.2,1)}

/* Chevron */
.fc-chev{
  width:24px;height:24px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line2);color:var(--t3);
  transition:all .2s;flex-shrink:0;
}
.fcard.open .fc-chev{transform:rotate(180deg);color:var(--blue);border-color:rgba(79,142,247,.3);background:var(--blue-d)}

/* ── EXPAND PANEL ── */
.expand{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.expand.open{grid-template-rows:1fr}
.expand-inner{overflow:hidden}
.expand-body{border-top:1px solid var(--line);background:var(--card2);padding:20px 16px}

.commentary{
  font-size:12px;line-height:1.7;padding:10px 13px;border-radius:8px;
  margin-bottom:18px;border-left:2px solid;
}
.commentary.con{background:var(--green-d);border-color:var(--green);color:rgba(34,197,94,.9)}
.commentary.spl{background:var(--amber-d);border-color:var(--amber);color:rgba(245,158,11,.9)}

.exp-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.exp-block{}
.exp-ttl{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}

/* Prob bars */
.prob-list{display:flex;flex-direction:column;gap:7px}
.prob-item{display:flex;align-items:center;gap:10px}
.prob-lbl{font-size:11px;color:var(--t2);width:36px;flex-shrink:0}
.prob-track{flex:1;height:3px;background:var(--line2);border-radius:2px;overflow:hidden}
.prob-fill{height:3px;border-radius:2px}
.prob-val{font-size:11px;font-weight:600;font-family:var(--mono);color:var(--t1);width:36px;text-align:right;flex-shrink:0}

/* Signal grid */
.sig-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.scel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.scel-lbl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;display:block;margin-bottom:3px}
.scel-val{font-size:12px;font-weight:600;font-family:var(--mono);color:var(--t1)}

/* Detail cells */
.detail-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.dcel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.dcel label{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;display:block;margin-bottom:3px}
.dcel span{font-size:12px;font-weight:600;font-family:var(--mono);color:var(--t1)}

.corners-note{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:11px;color:var(--t2);font-family:var(--mono);line-height:1.7;margin-bottom:10px}

/* Event grid */
.ev-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.ecel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.ecel label{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;display:block;margin-bottom:3px}
.ecel span{font-size:12px;font-weight:600;font-family:var(--mono)}
.ecel span.hi{color:var(--green)}
.ecel span.lo{color:var(--red)}
.ecel span.mid{color:var(--amber)}

.leg-banner{margin-top:8px;padding:8px 12px;background:var(--amber-d);border:1px solid rgba(245,158,11,.2);border-radius:8px;font-size:11px;color:var(--amber);font-family:var(--mono)}
.fat-row{display:flex;gap:6px;margin-top:8px}
.fat-item{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:10px;color:var(--t3)}
.fat-item span{color:var(--t1);font-weight:600;display:block;margin-top:2px;font-size:11px}

/* ── RESULTS ── */
.session-block{margin-bottom:16px}
.session-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 14px;background:var(--card);border:1px solid var(--line);
  border-radius:10px 10px 0 0;border-bottom:none;
}
.session-date{font-size:14px;font-weight:600}
.session-acc{display:flex;align-items:center;gap:10px}
.acc-frac{font-size:11px;color:var(--t3);font-family:var(--mono)}
.acc-pct{font-size:18px;font-weight:700;font-family:var(--mono)}
.acc-pct.good{color:var(--green)}.acc-pct.mid{color:var(--amber)}.acc-pct.low{color:var(--red)}
.res-row{
  display:grid;grid-template-columns:90px 1fr 80px 80px 28px;
  align-items:center;gap:10px;padding:11px 14px;
  background:var(--card);border:1px solid var(--line);border-top:none;transition:background .12s;
}
.res-row:last-child{border-radius:0 0 10px 10px}
.res-row:hover{background:var(--card2)}
.res-league{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.5px}
.res-matchup{font-size:13px;font-weight:600}
.res-positions{font-size:10px;color:var(--t3);margin-top:2px}
.res-pred,.res-actual{text-align:center}
.res-pred-out,.res-actual-out{font-size:12px;font-weight:600}
.res-pred-score,.res-actual-score{font-size:10px;color:var(--t3);font-family:var(--mono);margin-top:1px}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:60px 20px}
.empty-ball{font-size:40px;display:inline-block;animation:eb 1.2s ease-in-out infinite;margin-bottom:14px}
@keyframes eb{0%,100%{transform:translateY(0)}40%{transform:translateY(-18px)}}
.empty-title{font-size:17px;font-weight:600;margin-bottom:6px}
.empty-sub{font-size:13px;color:var(--t3)}
.state-msg{text-align:center;padding:60px 0;font-size:13px;color:var(--t3)}

footer{text-align:center;padding:18px 24px;font-size:11px;color:var(--t3);border-top:1px solid var(--line);margin-top:20px}

/* ── MOBILE ── */
@media(max-width:700px){
  .shell{grid-template-columns:1fr;display:block}
  .sidebar{display:none}
  .content{padding:16px 0}
  .fcard-top{grid-template-columns:60px 1fr 28px;gap:10px}
  .fc-tags,.fc-verdict{display:none}
  .mobile-verdict{display:flex!important;align-items:center;gap:8px;padding:0 14px 12px}
  .detail-row{grid-template-columns:repeat(2,1fr)}
  .ev-grid{grid-template-columns:repeat(2,1fr)}
  .exp-row{grid-template-columns:1fr}
  .sig-grid{grid-template-columns:1fr 1fr}
}
.mobile-verdict{display:none}
.mobile-filter{display:none}
@media(max-width:700px){
  .mobile-filter{display:flex;overflow-x:auto;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
  .mobile-filter::-webkit-scrollbar{display:none}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">FSL · <em>Predictions</em></div>
    <div class="topbar-right">
      <div class="live-pill">Live</div>
      <div class="topbar-date" id="hdr-date">–</div>
    </div>
  </div>
</div>

<!-- Mobile filter strip -->
<div class="mobile-filter" id="mobile-filters"></div>

<div class="shell">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">View</div>
      <div class="tab-list">
        <button class="tab-btn-s on" id="tab-upcoming" onclick="switchTab('upcoming')">Upcoming</button>
        <button class="tab-btn-s" id="tab-results" onclick="switchTab('results')">Results</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Today</div>
      <div class="stat-list">
        <div class="stat-row"><span class="stat-row-label">Fixtures</span><span class="stat-row-val blue" id="s-total">–</span></div>
        <div class="stat-row"><span class="stat-row-label">Consensus</span><span class="stat-row-val green" id="s-con">–</span></div>
        <div class="stat-row"><span class="stat-row-label">Data picks</span><span class="stat-row-val amber" id="s-spl">–</span></div>
        <div class="stat-row"><span class="stat-row-label">High conf</span><span class="stat-row-val" id="s-hc">–</span></div>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Leagues</div>
      <div class="league-list" id="filters"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="content">
    <div id="upcoming-panel">
      <div class="page-hdr">
        <div class="page-title">Today's <span>Picks</span></div>
        <div class="page-sub" id="hero-date-line">Loading…</div>
      </div>
      <div class="notice-bar" id="started-notice"></div>
      <div id="cards"><div class="state-msg">Loading predictions…</div></div>
    </div>

    <div id="results-panel" style="display:none">
      <div class="page-hdr"><div class="page-title">Results</div></div>
      <div id="results-content"><div class="state-msg">Loading results…</div></div>
    </div>
  </main>
</div>

<footer>FSL Predictions · Fredrick Strategy Lab · For informational purposes only</footer>

<script>
let ALL = [], active = "All";
const fmt = (n,d=1) => Number(n).toFixed(d);

const LEAGUE_FLAG = {
  "Premier League":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","Championship":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","La Liga":"🇪🇸","Bundesliga":"🇩🇪",
  "Serie A":"🇮🇹","Ligue 1":"🇫🇷","Eredivisie":"🇳🇱","Primeira Liga":"🇵🇹",
  "Champions League":"🏆","Europa League":"🏆","Europa Conference League":"🏆",
  "Brasileirão":"🇧🇷","Süper Lig":"🇹🇷","Scottish Premiership":"🏴󠁧󠁢󠁳󠁣󠁴󠁿",
  "Pro League":"🇧🇪","Super League":"🇨🇭","Super League Greece":"🇬🇷","World Cup":"🌍",
  "EFL Cup":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","FA Cup":"🏴󠁧󠁢󠁥󠁮󠁧󠁿",
};

function toUTC(iso){
  // Parse ISO string correctly — handles Z, +00:00, and bare datetime
  if(!iso)return new Date();
  try{return new Date(iso)}catch(e){return new Date()}
}
function toWAT(d){
  if(!d.kickoff_utc)return d.time||"–";
  try{return new Date(d.kickoff_utc).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Africa/Lagos"})}
  catch(e){return d.time||"–"}
}
function isUpcoming(d){
  if(!d.kickoff_utc)return true;
  try{
    const kickoff = new Date(d.kickoff_utc);
    const now = new Date();
    // Add 110 min buffer — hide games only after they're likely finished
    return kickoff > new Date(now.getTime() - 110*60*1000);
  }catch(e){return true}
}
function dayLabel(s){return new Date(s+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
function animateNum(el,target){
  const dur=600,t0=performance.now();
  const tick=now=>{const p=Math.min((now-t0)/dur,1),e=1-Math.pow(1-p,3);el.textContent=Math.round(e*target);if(p<1)requestAnimationFrame(tick)};
  requestAnimationFrame(tick);
}
function outCls(o){const s=(o||"").toLowerCase();return s.includes("home")?"home":s.includes("away")?"away":"draw"}
function confBarColor(conf,isCon,isAvd){
  if(isCon)return "var(--green)";
  if(isAvd)return "var(--red)";
  if(conf>=65)return "var(--blue)";
  return "var(--amber)";
}

// Prediction nametags
function getTags(d){
  const tags=[];
  const out=(d.outcome||"").toLowerCase();
  const sc=d.score||"0-0";
  const [h,a]=sc.split("-").map(Number);
  const tot=(h||0)+(a||0);

  if(out.includes("home"))      tags.push({t:"Home Win",cls:"p"});
  else if(out.includes("away")) tags.push({t:"Away Win",cls:"p"});
  else if(out.includes("draw")) tags.push({t:"Draw",cls:"p"});

  if(!isNaN(tot)){
    if(tot>=3)      tags.push({t:"Over 2.5",cls:"s"});
    else if(tot>=2) tags.push({t:"Over 1.5",cls:"s"});
    else            tags.push({t:"Under 1.5",cls:""});
  }
  if((d.btts||0)>=60)       tags.push({t:"BTTS ✓",cls:"s"});
  else if((d.btts||0)<=30)  tags.push({t:"BTTS ✗",cls:""});

  const ct=parseFloat((d.corners||"").split("Total:")[1])||0;
  if(ct>=10)     tags.push({t:"O9.5 Corners",cls:""});
  else if(ct>=9) tags.push({t:"O8.5 Corners",cls:""});

  return tags.slice(0,4);
}

// Commentary
const CON_C=["Both signals agree. When the model stops arguing with itself, take note.","Data and numerology shook hands. Rare. Proceed accordingly.","Full alignment. No debate. The model just said yes and went home.","Consensus. The algorithm didn't need a second opinion on this one.","Both signals locked. Whether they're right is a different question.","When data and numbers agree, something interesting is probably happening.","The model walked in, looked at both signals, nodded, and left.","Straight consensus. The kind that makes you pay slightly more attention."];
const SPL_C=["Data says one thing. Numbers say another. Welcome to football.","Split signals. One of them is correct. We'll know at full time.","The model consulted itself and disagreed. Classic.","Both signals looked at the same fixture and reached different conclusions.","Divided. The war room has two factions and no moderator.","One signal says yes. One says no. You're the tiebreaker now.","The model is pointing in two directions at once. Pick carefully.","Disagreement detected. Proceed with appropriate awareness of that fact."];
function getComment(type,home,away){const s=((home||"").charCodeAt(0)+(away||"").charCodeAt(0))%8;return type==="consensus"?CON_C[s]:SPL_C[s]}

function ecel(label,val,hi,lo){
  const cls=val>=hi?"hi":val<=lo?"lo":"mid";
  return `<div class="ecel"><label>${label}</label><span class="${cls}">${fmt(val)}%</span></div>`;
}
function legBanner(d){
  if(d.second_leg&&d.leg_context)return`<div class="leg-banner">2nd Leg · ${d.leg_context}</div>`;
  return"";
}
function fatigueBanner(d){
  const hf=d.home_fatigue||1,af=d.away_fatigue||1;
  if(hf<0.97||af<0.97){
    const hT=hf<0.97?"⚠ "+Math.round((1-hf)*100)+"% reduced":"Fresh";
    const aT=af<0.97?"⚠ "+Math.round((1-af)*100)+"% reduced":"Fresh";
    return`<div class="fat-row"><div class="fat-item">Home fatigue<span>${hT}</span></div><div class="fat-item">Away fatigue<span>${aT}</span></div></div>`;
  }
  return"";
}

function render(){
  const base=active==="All"?ALL:ALL.filter(d=>d.league===active);
  const list=base.filter(d=>isUpcoming(d));
  const hidden=base.length-list.length;

  animateNum(document.getElementById("s-total"),list.length);
  animateNum(document.getElementById("s-con"),list.filter(d=>d.consensus==="consensus").length);
  animateNum(document.getElementById("s-spl"),list.filter(d=>d.consensus==="data").length);
  animateNum(document.getElementById("s-hc"),list.filter(d=>d.conf>=65).length);

  const notice=document.getElementById("started-notice");
  if(hidden>0){notice.textContent=`${hidden} game${hidden>1?"s":""} already started — hidden`;notice.style.display="block"}
  else{notice.style.display="none"}

  const wrap=document.getElementById("cards");
  if(!list.length){
    const allDone=ALL.length>0&&ALL.every(d=>!isUpcoming(d));
    wrap.innerHTML=allDone
      ?`<div class="empty-state"><div class="empty-ball">⚽</div><div class="empty-title">All wrapped up</div><div class="empty-sub">Come back tomorrow for fresh picks</div></div>`
      :`<div class="state-msg">No fixtures for this selection.</div>`;
    return;
  }

  // Group by date
  const groups={};
  list.forEach(d=>{
    const key=d.match_date||(d.kickoff_utc?d.kickoff_utc.slice(0,10):"Today");
    if(!groups[key])groups[key]=[];
    groups[key].push(d);
  });
  const dates=Object.keys(groups).sort();
  const todayStr=new Date().toISOString().slice(0,10);
  const tmrwStr=new Date(Date.now()+86400000).toISOString().slice(0,10);
  function fmtDay(dk){
    if(dk===todayStr)return"Today";
    if(dk===tmrwStr)return"Tomorrow";
    const dt=new Date(dk+"T12:00:00Z");
    return dt.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"});
  }

  let html="",gi=0;
  dates.forEach(dk=>{
    const dayFix=groups[dk];
    html+=`<div class="day-group">
      <div class="day-hdr">
        <span class="day-name">${fmtDay(dk)}</span>
        <span class="day-rule"></span>
        <span class="day-ct">${dayFix.length} fixture${dayFix.length!==1?"s":""}</span>
      </div>`;

    dayFix.forEach(d=>{
      const i=gi++;
      const isCon=d.consensus==="consensus";
      const isAvd=!isCon&&d.conf<28;
      const isSpl=!isCon&&!isAvd;
      const bCls=isCon?"con":isAvd?"avd":"data";
      const bTxt=isCon?"Consensus":isAvd?"Avoid":"Data";
      const cCls="fcard"+(isCon?" con":d.conf>=65?" hi":"");
      const outFl=d.outcome+(d.uncertain?" ?":"");
      const oCls=outCls(d.outcome);
      const sigM=isCon?`Data & Num: ${d.data_sig}`:`D: ${d.data_sig} / N: ${d.num_sig}`;
      const ktime=toWAT(d);
      const barCol=confBarColor(d.conf,isCon,isAvd);
      const comment=getComment(d.consensus,d.home,d.away);
      const commentCls=isCon?"con":"spl";
      const tags=getTags(d);
      const tagsHtml=tags.map(t=>`<span class="ntag ${t.cls}">${t.t}</span>`).join("");
      const flag=LEAGUE_FLAG[d.league]||"";

      html+=`<div class="${cCls}" id="c${i}" style="animation-delay:${i*.03}s">
  <div class="fcard-top" onclick="tog(${i})">
    <div class="fc-time">
      <div class="fc-kick">${ktime}</div>
      <div class="fc-tz">WAT</div>
    </div>
    <div class="fc-match">
      <div class="fc-comp">${flag} ${d.league}</div>
      <div class="fc-teams">
        <span class="fc-team">${d.home}</span>
        <span class="fc-vs">vs</span>
        <span class="fc-team">${d.away}</span>
      </div>
      <div class="fc-pos">Home ${d.hpos} · Away ${d.apos}</div>
    </div>
    <div class="fc-tags">
      <div class="signal-badge ${bCls}">${bTxt}</div>
      <div class="ntag-row">${tagsHtml}</div>
    </div>
    <div class="fc-verdict">
      <div class="verdict-pill ${oCls}">${outFl}</div>
      <div class="fc-score">${d.score}</div>
      <div class="fc-conf">${fmt(d.conf)}%</div>
      <div class="conf-bar"><div class="conf-fill" id="bar${i}" data-conf="${Math.round(d.conf)}" style="background:${barCol}"></div></div>
    </div>
    <div class="fc-chev">
      <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
        <path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
  <div class="mobile-verdict">
    <div class="verdict-pill ${oCls}">${outFl}</div>
    <div class="signal-badge ${bCls}" style="font-size:10px">${bTxt}</div>
    <div class="ntag-row">${tagsHtml}</div>
  </div>
  <div class="expand" id="e${i}">
    <div class="expand-inner">
      <div class="expand-body">
        <div class="commentary ${commentCls}">${comment}</div>
        <div class="exp-row">
          <div class="exp-block">
            <div class="exp-ttl">Win probability</div>
            <div class="prob-list">
              <div class="prob-item"><span class="prob-lbl">Home</span><div class="prob-track"><div class="prob-fill" style="width:${d.hw}%;background:var(--blue)"></div></div><span class="prob-val">${fmt(d.hw)}%</span></div>
              <div class="prob-item"><span class="prob-lbl">Draw</span><div class="prob-track"><div class="prob-fill" style="width:${d.dr}%;background:var(--t3)"></div></div><span class="prob-val">${fmt(d.dr)}%</span></div>
              <div class="prob-item"><span class="prob-lbl">Away</span><div class="prob-track"><div class="prob-fill" style="width:${d.aw}%;background:var(--red)"></div></div><span class="prob-val">${fmt(d.aw)}%</span></div>
            </div>
          </div>
          <div class="exp-block">
            <div class="exp-ttl">Signals</div>
            <div class="sig-grid">
              <div class="scel"><span class="scel-lbl">Data</span><span class="scel-val">${d.data_sig}</span></div>
              <div class="scel"><span class="scel-lbl">Numerology</span><span class="scel-val">${d.num_sig}</span></div>
              <div class="scel"><span class="scel-lbl">Verdict</span><span class="scel-val">${bTxt}</span></div>
            </div>
          </div>
        </div>
        <div class="detail-row">
          <div class="dcel"><label>Score</label><span>${d.score}</span></div>
          <div class="dcel"><label>Confidence</label><span>${fmt(d.conf)}%</span></div>
          <div class="dcel"><label>Gap</label><span>${fmt(d.gap)}%</span></div>
          <div class="dcel"><label>Corners</label><span>${d.corners}</span></div>
        </div>
        <div class="corners-note">${d.corners_note}</div>
        <div class="exp-ttl" style="margin-bottom:8px">Event probabilities</div>
        <div class="ev-grid">
          ${ecel("BTTS",d.btts||0,60,35)}
          ${ecel("Home CS",d.home_cs||0,40,20)}
          ${ecel("Away CS",d.away_cs||0,40,20)}
          ${ecel("Late goal",d.late_goal||0,60,35)}
          ${ecel("Penalty",d.penalty||0,70,30)}
          ${ecel("Home comeback",d.home_comeback||0,55,30)}
          ${ecel("Away comeback",d.away_comeback||0,55,30)}
          ${ecel("Red card",50,70,30)}
        </div>
        ${legBanner(d)}
        ${fatigueBanner(d)}
      </div>
    </div>
  </div>
</div>`;
    });
    html+=`</div>`;
  });

  wrap.innerHTML=html;
  requestAnimationFrame(()=>{
    for(let j=0;j<gi;j++){
      const bar=document.getElementById("bar"+j);
      if(bar)setTimeout(()=>{bar.style.width=bar.getAttribute("data-conf")+"%"},80+j*30);
    }
  });
}

function tog(i){
  document.getElementById("c"+i).classList.toggle("open");
  document.getElementById("e"+i).classList.toggle("open");
}

function buildFilters(data){
  const leagues=["All",...new Set(data.map(d=>d.league))];
  const html=leagues.map(l=>`<button class="league-btn${l===active?" on":""}" onclick="setL('${l}')"><span class="league-flag">${LEAGUE_FLAG[l]||"🌐"}</span>${l}</button>`).join("");
  document.getElementById("filters").innerHTML=html;
  // mobile
  const mhtml=leagues.map(l=>`<button class="ftag${l===active?" on":""}" onclick="setL('${l}')" style="white-space:nowrap;padding:5px 12px;border-radius:20px;border:1px solid var(--line2);font-size:12px;font-weight:500;color:var(--t2);background:none;cursor:pointer">${LEAGUE_FLAG[l]||"🌐"} ${l}</button>`).join("");
  const mf=document.getElementById("mobile-filters");
  if(mf)mf.innerHTML=mhtml;
}

function setL(l){active=l;buildFilters(ALL);render()}

async function load(){
  try{
    const res=await fetch("predictions.json?t="+Date.now());
    const json=await res.json();
    ALL=json.fixtures||[];
    document.getElementById("hdr-date").textContent=json.generated;
    document.getElementById("hero-date-line").textContent=dayLabel(json.generated)+" — "+json.version;
    buildFilters(ALL);
    render();
  }catch(e){
    document.getElementById("cards").innerHTML='<div class="state-msg">Could not load predictions.</div>';
  }
}

let RESULTS=null;
function switchTab(t){
  document.getElementById("tab-upcoming").classList.toggle("on",t==="upcoming");
  document.getElementById("tab-results").classList.toggle("on",t==="results");
  document.getElementById("upcoming-panel").style.display=t==="upcoming"?"":"none";
  document.getElementById("results-panel").style.display=t==="results"?"":"none";
  if(t==="results"&&!RESULTS)loadResults();
}

function renderResults(data){
  const wrap=document.getElementById("results-content");
  const sessions=data.sessions||[];
  if(!sessions.length){
    wrap.innerHTML=`<div class="empty-state"><div class="empty-ball">⚽</div><div class="empty-title">No results yet</div><div class="empty-sub">Check back after today's games</div></div>`;
    return;
  }
  wrap.innerHTML=sessions.map(s=>{
    const pct=s.pct||0;
    const pCls=pct>=55?"good":pct>=35?"mid":"low";
    const rows=(s.games||[]).map(g=>{
      const pCol=g.predicted==="Home"?"var(--blue)":g.predicted==="Away"?"var(--red)":"var(--t3)";
      const aCol=g.actual_outcome==="Home"?"var(--blue)":g.actual_outcome==="Away"?"var(--red)":"var(--t3)";
      return`<div class="res-row">
        <div class="res-league">${LEAGUE_FLAG[g.league]||""} ${g.league}</div>
        <div><div class="res-matchup">${g.home} vs ${g.away}</div><div class="res-positions">Home ${g.hpos} · Away ${g.apos}</div></div>
        <div class="res-pred"><div class="res-pred-out" style="color:${pCol}">${g.predicted}</div><div class="res-pred-score">${g.predicted_score}</div></div>
        <div class="res-actual"><div class="res-actual-out" style="color:${aCol}">${g.actual_outcome}</div><div class="res-actual-score">${g.actual_score}</div></div>
        <div style="text-align:center;font-size:15px">${g.correct?"✅":"❌"}</div>
      </div>`;
    }).join("");
    return`<div class="session-block"><div class="session-hdr"><div class="session-date">${s.date}</div><div class="session-acc"><span class="acc-frac">${s.correct}/${s.total}</span><span class="acc-pct ${pCls}">${pct}%</span></div></div>${rows}</div>`;
  }).join("");
}

async function loadResults(){
  try{
    const r=await fetch("results.json?t="+Date.now());
    RESULTS=await r.json();
    renderResults(RESULTS);
  }catch(e){
    document.getElementById("results-content").innerHTML='<div class="state-msg">No results yet.</div>';
  }
}

load();
setInterval(()=>{if(ALL.length)render()},60000);
</script>
</body>
